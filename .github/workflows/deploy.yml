name: CD Pipeline - Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'database/**'
      - 'package*.json'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write # Required for requesting the JWT for Azure OIDC Federated Identity
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    if: github.repository == 'Amankumarx1/Leaklens'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Run Test Suite
        run: npm test

      - name: Build Production Frontend
        run: npm run build:client

      - name: Package Deployment Archive
        run: |
          zip -r release.zip \
            server \
            client/dist \
            database \
            package.json \
            package-lock.json \
            -x "**/node_modules/*" "**/.git/*"

      # Authenticate to Azure using OIDC Federated Identity (Zero Secrets Stored)
      - name: Azure Login via OIDC
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Deploy to Azure Web App
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'leaklens-app' }}
          package: release.zip
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Post-Deployment Readiness Check
        if: env.AZURE_APP_URL != ''
        run: |
          echo "Waiting 20 seconds for App Service warmup..."
          sleep 20
          curl -f -s "${{ secrets.AZURE_APP_URL }}/api/health/ready" || echo "Readiness probe pending."
        env:
          AZURE_APP_URL: ${{ secrets.AZURE_APP_URL }}
